[package]
name = "sanctuary-pad"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SDL 1.2 proxy DLL that adds XInput controller support to SanctuaryRPG: Black Edition"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
panic = "abort"

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
