# Controller bindings for SanctuaryRPG. Format: <button> = <key>
#
# Buttons: up down left right (d-pad or left stick), a b x y, lb rb lt rt,
#          start back, ls rs (stick clicks)
# Keys:    any single character (1, q, Q, ...), or one of:
#          enter escape space tab backspace up down left right none

up = up
down = down
left = left
right = right
a = enter
b = backspace
x = 1
y = 2
lb = 3
rb = 4
lt = 5
rt = 6
start = enter
back = backspace

# Menu navigation: when the screen shows choices like "[1] Play", the d-pad moves a
# highlight between them, A picks the highlighted one and B picks Back/Cancel if offered.
# The bindings above still apply on every other screen and for all other buttons.
menu_navigation = true

# Debug: log the on-screen text to sanctuary-pad-screen.txt whenever it changes.
dump_screen = false
